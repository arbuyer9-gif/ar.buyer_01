<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Store</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="logo">
            <a href="#">Loro Piana Style</a>
        </div>
        <div class="cart-icon">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
    </header>

    <main class="main-content">
        <section class="hero">
            <h1>Коллекция Осень-Зима</h1>
            <p>Исключительное качество и минимализм в каждой детали.</p>
        </section>

        <section class="product-grid">
            <article class="product-card">
                <div class="image-placeholder"></div>
                <h2>Кашемировый джемпер</h2>
                <span class="price">120 000 сом</span>
            </article>
            <article class="product-card">
                <div class="image-placeholder"></div>
                <h2>Шарф из шерсти мериноса</h2>
                <span class="price">35 000 сом</span>
            </article>
            <article class="product-card">
                <div class="image-placeholder"></div>
                <h2>Замшевые лоферы</h2>
                <span class="price">85 000 сом</span>
            </article>
        </section>
    </main>
</body>
</html>
