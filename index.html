<header>
    <nav>
        <button class="menu-toggle" aria-label="Открыть меню">&#9776;</button>
        <div class="logo">ar.buyer_01</div>
        <a href="#cart" class="cart-icon" aria-label="Корзина">&#128722;</a>
    </nav>
    <div class="nav-drawer" id="nav-drawer">
        <button class="close-menu">&times;</button>
        <ul>
            <li><a href="#profile">Мой профиль</a></li>
            <li><a href="#collections">Новые коллекции</a></li>
            <li><a href="#home">Главная</a></li>
            <li><a href="#men">Мужское</a></li>
            <li><a href="#women">Женское</a></li>
            <li><a href="#catalog">Каталог</a></li>
            <li><a href="#vip">VIP Зона</a></li>
        </ul>
    </div>
</header>
<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const closeMenu = document.querySelector('.close-menu');
    const navDrawer = document.getElementById('nav-drawer');

    menuToggle.addEventListener('click', () => {
        navDrawer.classList.add('active');
    });

    closeMenu.addEventListener('click', () => {
        navDrawer.classList.remove('active');
    });

    window.addEventListener('click', (e) => {
        if (!navDrawer.contains(e.target) && !menuToggle.contains(e.target)) {
            navDrawer.classList.remove('active');
        }
    });
</script>
